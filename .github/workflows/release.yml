name: Release

# Turn a pushed semver tag into a GitHub Release whose notes are taken from
# the matching CHANGELOG.md section (falling back to auto-generated notes if
# the section is missing).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$GITHUB_REF_NAME"
          notes="$(mktemp)"
          if bash tools/extract_changelog.sh "$version" > "$notes" && [ -s "$notes" ]; then
            echo "Using CHANGELOG.md notes for $version"
            gh release create "$version" --title "$version" --notes-file "$notes" --verify-tag
          else
            echo "No CHANGELOG.md section for $version; generating notes"
            gh release create "$version" --title "$version" --generate-notes --verify-tag
          fi
