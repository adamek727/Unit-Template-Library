name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pin to the same version used to format the tree so CI and local agree.
      - name: Install clang-format
        run: pip install clang-format==22.1.5

      - name: Check formatting
        run: |
          clang-format --version
          clang-format --dry-run --Werror $(find include tests examples \( -name '*.hpp' -o -name '*.cpp' \))

  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtest-dev

      - name: Configure
        run: cmake -B build -DENABLE_TESTS=1 -DENABLE_EXAMPLES=1 -DENABLE_WERROR=1 -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Run example
        run: ./build/examples/usage_example

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtest-dev

      - name: Configure
        run: cmake -B build -DENABLE_TESTS=1 -DENABLE_EXAMPLES=1 -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -g"

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Run example
        run: ./build/examples/usage_example

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DENABLE_TESTS=1 -DENABLE_EXAMPLES=1 -DENABLE_WERROR=1

      - name: Build
        run: cmake --build build --config Debug -j

      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure

      - name: Run example
        run: ./build/examples/Debug/usage_example.exe

  zero-overhead:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Zero-overhead proof (g++)
        run: python3 tools/check_zero_overhead.py g++

      - name: Zero-overhead proof (clang++)
        run: python3 tools/check_zero_overhead.py clang++
